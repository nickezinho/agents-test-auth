services:
  db:
    image: postgres:16-alpine
    container_name: auth_lab_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_local_123}
      POSTGRES_DB: ${POSTGRES_DB:-auth_lab_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_lab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth_lab_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_local_123}@db:5432/${POSTGRES_DB:-auth_lab_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super_secret_jwt_key_should_be_at_least_32_bytes_long_123456}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - COOKIE_SECURE=False
      - COOKIE_SAMESITE=lax
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-google-client-id.apps.googleusercontent.com}
      - CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auth-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auth_lab_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  postgres_data:
